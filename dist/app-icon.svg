<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Dark Background -->
  <rect width="512" height="512" fill="#0A0A0A"/>

  <!-- GymHub Logo at top -->
  <g transform="translate(68, 50)">
    <!-- 'Gym' Text -->
    <text x="0" y="70" font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="76" fill="#FFFFFF">Gym</text>
    <!-- 'Hub' Orange Badge -->
    <rect x="180" y="0" width="190" height="90" rx="20" fill="#F76B1C"/>
    <!-- 'Hub' Text -->
    <text x="202" y="70" font-family="'Outfit', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="76" fill="#0A0A0A">Hub</text>
  </g>

  <!-- Flexing Bodybuilder Silhouette -->
  <g stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Head -->
    <ellipse cx="256" cy="205" rx="30" ry="38" fill="#0A0A0A" stroke-width="8"/>
    
    <!-- Neck & Traps -->
    <path d="M232 235 Q205 255 180 270" stroke-width="8"/>
    <path d="M280 235 Q307 255 332 270" stroke-width="8"/>
    
    <!-- Left Arm & Bicep Flex -->
    <path d="M180 270 C150 255 115 220 105 185 C95 150 120 120 155 120 C175 120 188 140 182 175 C178 195 165 210 150 225 C140 235 130 250 150 275 C168 298 195 305 218 298" fill="#0A0A0A" stroke-width="9"/>
    <!-- Left Fist -->
    <path d="M155 120 C145 108 122 108 115 125 C108 142 125 155 138 142 Z" fill="#FFFFFF"/>
    
    <!-- Right Arm & Bicep Flex -->
    <path d="M332 270 C362 255 397 220 407 185 C417 150 392 120 357 120 C337 120 324 140 330 175 C334 195 347 210 362 225 C372 235 382 250 362 275 C344 298 317 305 294 298" fill="#0A0A0A" stroke-width="9"/>
    <!-- Right Fist -->
    <path d="M357 120 C367 108 390 108 397 125 C404 142 387 155 374 142 Z" fill="#FFFFFF"/>
    
    <!-- Chest (Pecs) -->
    <path d="M256 295 L256 385" stroke-width="7"/>
    <path d="M256 295 C215 295 175 308 158 350 C175 375 215 385 256 385 C297 385 337 375 354 350 C337 308 297 295 256 295 Z" stroke-width="9"/>
    <path d="M158 350 C205 380 238 380 256 380" stroke-width="7"/>
    <path d="M354 350 C307 380 274 380 256 380" stroke-width="7"/>

    <!-- Abs (6-Pack) -->
    <path d="M216 405 H296 M210 440 H302 M218 475 H294" stroke-width="7"/>
    <path d="M256 385 V500" stroke-width="7"/>

    <!-- Lats / Torso Outlines -->
    <path d="M158 350 C148 385 170 440 195 495" stroke-width="8"/>
    <path d="M354 350 C364 385 342 440 317 495" stroke-width="8"/>
  </g>
</svg>
